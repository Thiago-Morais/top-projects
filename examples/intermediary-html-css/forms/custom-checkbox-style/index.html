<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title></title>
        <link href="style.css" rel="stylesheet" />
    </head>
    <body>
        <label class="form-control">
            <input type="checkbox" name="checkbox" />
            Checkbox
        </label>

        <label class="form-control">
            <input type="checkbox" name="checkbox-checked" checked />
            Checkbox - checked
        </label>

        <label class="form-control form-control--disabled">
            <input type="checkbox" name="checkbox" disabled />
            Checkbox
        </label>

        <label class="form-control form-control--disabled">
            <input type="checkbox" name="checkbox-checked" disabled checked />
            Checkbox - checked
        </label>
        <footer>
            <a href="https://moderncss.dev/pure-css-custom-checkbox-style">File Source</a>
            <a href="https://www.theodinproject.com/lessons/node-path-intermediate-html-and-css-form-basics">Odin Source</a>
        </footer>
    </body>
</html>
